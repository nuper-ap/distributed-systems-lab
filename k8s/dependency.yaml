apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dependency
  template:
    metadata:
      labels:
        app: dependency
    spec:
      containers:
        - name: dependency
          image: distributed-systems-lab/dependency:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
